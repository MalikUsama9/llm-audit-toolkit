[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-audit-toolkit"
version = "0.1.0"
description = "Toolkit for auditing LLM behavior"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "pyyaml",
    "httpx",
    "litellm",
]

[project.optional-dependencies]
report = ["jinja2", "weasyprint"]
dev = ["pytest", "ruff", "jinja2", "weasyprint"]

[project.scripts]
audit = "audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"audit.reporting" = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]