name: faithfulness
version: "1.2"
applies_to: "answerable and unanswerable cases (claim level)"
rules:
  - "Length is not quality. Do not reward detail that the source does not support."
  - "Material claims only: ignore greetings, apologies and filler. Check numbers, dates, policies, names and conditions."
  - "For every supported or contradicted claim, quote a short evidence snippet from the source or reference."
  - "The case-level hallucination flag is computed in code (any claim not supported), not by you."
  - "A refusal, abstention or clarifying question (for example 'I don't have that information' or 'what do you mean by it?') is not a factual claim. Do not list it, and do not list offers of help or support contact details given as a fallback."
  - "If the answer makes no factual claims (for example it only refuses), return an empty claims list and verdict supported."
  - "Keep reasoning to 2-4 sentences."
labels:
  supported:
    definition: "The source excerpt or reference backs the claim."
    borderline: "Bot says 'about a week' when the source says 7 days. Supported."
  contradicted:
    definition: "The source says something different from the claim."
    borderline: "Bot says free shipping over $40 when the source says over $50."
  not_in_source:
    definition: "The claim is a specific fact (number, policy, date, name) that the source does not contain."
    borderline: "Bot says shipping takes 3 to 5 days when the source gives no delivery time."
few_shot:
  # synthetic: written by hand for the judge prompt, never a real bot answer, never counted in results
  - case_id: "synthetic-S6"
    question: "If I place an order at 4:00 PM on a Tuesday, when will it ship?"
    reference: "Your order will ship on the next business day, which is Wednesday."
    source: "Orders placed before 2:00 PM PT on a business day ship the same day. Orders placed after 2:00 PM PT, or on a weekend or holiday, ship on the next business day."
    bot_answer: "Orders placed after 2:00 PM PT take 2 business days to ship, so your order will ship on Thursday."
    claims:
      - claim: "Orders placed after 2:00 PM PT take 2 business days to ship"
        status: "contradicted"
        evidence: "Orders placed after 2:00 PM PT, or on a weekend or holiday, ship on the next business day."
      - claim: "The order will ship on Thursday"
        status: "contradicted"
        evidence: "ship on the next business day"
    verdict: "contradicted"
    reasoning: "The source says the next business day, which is Wednesday. The bot states 2 business days and Thursday, so both claims contradict the source."